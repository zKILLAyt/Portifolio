<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Painel de Feedbacks</title>

    <link rel="stylesheet" href="style.css" />

    <!-- Vercel Speed Insights -->
    <script>
      window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
    </script>
    <script defer src="/_vercel/speed-insights/script.js"></script>
  </head>

  <body>
    <main class="admin-dashboard">
      <header class="admin-header">
        <div>
          <h1>📋 Feedbacks</h1>
          <p>Painel administrativo</p>
        </div>

        <button id="logoutButton">Sair</button>
      </header>

      <section class="feedback-dashboard">
        <div class="dashboard-title">
          <h2>Feedbacks pendentes</h2>
          <span id="pendingCount">0</span>
        </div>

        <div id="feedbackList">
          <p>Carregando feedbacks pendentes...</p>
        </div>
      </section>

      <section class="feedback-dashboard">
        <div class="dashboard-title">
          <h2>Feedbacks publicados</h2>
          <span id="publishedCount">0</span>
        </div>

        <div id="publishedList">
          <p>Carregando feedbacks publicados...</p>
        </div>
      </section>
    </main>

    <script src="admin-dashboard.js"></script>
  </body>
</html>
